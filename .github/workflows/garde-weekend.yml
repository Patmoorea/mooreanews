# Garde Moorea — COPPF + OCR + affiche MooreaNews.
# Tahiti UTC−10. OCR en CI (Tesseract) + OCR.space si clé configurée.

name: Garde week-end MooreaNews

on:
  schedule:
    # Mercredi 12h Tahiti — première tentative SEM de la semaine
    - cron: "0 22 * * 3"
    # Jeudi 6h / 12h / 17h Tahiti
    - cron: "0 16 * * 4"
    - cron: "0 22 * * 4"
    - cron: "0 3 * * 5"
    # Vendredi 6h Tahiti
    - cron: "0 16 * * 5"
    # Samedi 8h / Dimanche 6h Tahiti
    - cron: "0 18 * * 6"
    - cron: "0 16 * * 0"
    # Secours férié midweek : lun/mar 6h et 12h Tahiti
    - cron: "0 16 * * 1,2"
    - cron: "0 22 * * 1,2"
  workflow_dispatch:

concurrency:
  group: garde-weekend
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Langue OCR Tesseract (fra)
        run: node scripts/ensure-tesseract-lang.mjs

      - name: Sync garde avec OCR (CI)
        id: sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          GARDE_OCR_ENABLED: "true"
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
        run: npx tsx scripts/run-garde-sync-now.ts

      - name: Revalider le cache Vercel
        if: always() && steps.sync.outcome == 'success'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --http1.1 --max-time 90 \
            "https://www.mooreanews.com/api/cron/garde-weekend?secret=${CRON_SECRET}&force=1&wait=1" \
            | head -c 1200 || true

      - name: Vérifier le résultat (jeu–dim)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          DOW=$(TZ=Pacific/Tahiti date +%u)
          echo "Jour Tahiti DOW=${DOW} ($(TZ=Pacific/Tahiti date))"

          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            echo "Sync CI OK — médecin extrait"
            exit 0
          fi

          # Secours : appel direct Vercel (OCR.space si clé sur Vercel)
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET manquant"
            exit 1
          fi

          url="https://www.mooreanews.com/api/cron/garde-weekend?secret=${CRON_SECRET}&force=1&wait=1"
          code=$(curl -sS -o /tmp/garde.json -w "%{http_code}" --http1.1 --max-time 300 "$url")
          echo "Secours Vercel HTTP ${code}"
          head -c 1200 /tmp/garde.json || true
          echo ""

          found=0
          doctor=0
          grep -q '"found":true' /tmp/garde.json 2>/dev/null && found=1 || true
          grep -qE '"doctor":"[^"]+' /tmp/garde.json 2>/dev/null && doctor=1 || true

          if [ "$found" = "1" ] && [ "$doctor" = "1" ]; then
            echo "Garde OK (secours Vercel)"
            exit 0
          fi

          if [ "$DOW" -ge 1 ] && [ "$DOW" -le 3 ]; then
            echo "found=false en milieu de semaine — normal"
            exit 0
          fi

          echo "Garde attendue (jeu–dim) mais médecin absent"
          exit 1
