# Coupures Te Ito Rau (électricité) + sync alertes EDT / eau.
# Déclencheur dédié et léger, en plus de veille-hourly.yml : GitHub saute
# souvent les crons planifiés (constaté : 3–4 passages/jour au lieu de 8).
# Heures impaires (la veille horaire tourne aux heures paires), minute :23
# pour éviter le pic de charge GitHub de début d'heure.
# Secret : GitHub → Settings → Secrets → CRON_SECRET

name: Coupures Te Ito Rau

on:
  schedule:
    # 7h, 9h, 11h, 13h, 15h, 17h, 19h, 21h Tahiti (UTC−10)
    - cron: "23 17,19,21,23,1,3,5,7 * * *"
  workflow_dispatch:

concurrency:
  group: coupures-te-ito-rau
  cancel-in-progress: false

jobs:
  te-ito-rau:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Te Ito Rau + sync coupures
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET manquant dans les secrets GitHub du dépôt."
            exit 1
          fi
          code=$(curl -sS -o /tmp/te-ito.json -w "%{http_code}" --http1.1 --max-time 130 \
            "https://www.mooreanews.com/api/cron/te-ito-rau?secret=${CRON_SECRET}&wait=1")
          echo "HTTP ${code}"
          head -c 600 /tmp/te-ito.json || true
          echo ""
          [ "$code" = "200" ] || [ "$code" = "202" ]
